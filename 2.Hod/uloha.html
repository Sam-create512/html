<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formular</title>
</head>
<body>
<form action="#" method="post">
    <fieldset>
        <legend>Login</legend>
    <p>
        <label for="name">Meno:</label>
        <input type="text" name="name" id="name">
    </p>
    
    <p>
        <label for="surname">Priezvisko</label>
        <input type="text" name="surname" id="surname">
    </p>
    <p>
        <label for="mail">Email:</label>
        <input type="text" name="mail" id="mail">
    </p>

    <p>
        Pohlavie:
        <label for="pohlavie">Muž:</label>
        <input type="radio" name="pohlavie" id="pohlavie"><br>
        <label for="pohlavie">Žena</label>
        <input type="radio" name="pohlavie", id="pohlavie">
    </p>

    <p>
        Zručnosti:
        <label for="html">HTML</label>
        <input type="checkbox" name="html" id="html">

        <label for="css">CSS</label>
        <input type="checkbox" name="css" id="css">
    </p>
        
    <p>
        Správa: <br>
        <textarea rows="4" cols="15" name="comment" id="comment" no></textarea>
    </p>
    <p>
        <input type="submit" value="Odoslať">
    </p>
    </fieldset>
</form>
</body>
</html>
